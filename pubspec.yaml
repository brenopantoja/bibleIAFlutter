name: bibliaia
description: Bible IA - Intelligent Bible App
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.7

  # Estado
  flutter_riverpod: ^3.0.3

  # HTTP
  dio: ^5.9.0
  http: ^1.6.0

  # Logs
  logger: ^2.6.1

  # Internacionalização
  intl: ^0.20.2

  # Banco local
  sqflite: ^2.4.2
  path: ^1.9.1

  # Preferências
  shared_preferences: ^2.5.3

  share_plus: ^12.0.2

  scrollable_positioned_list: ^0.3.8

  # Notificações
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Gerador de ícones
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/json/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
